name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run backend tests with coverage
        run: npm run test:coverage -w akamoney-backend

      - name: Run frontend tests with coverage
        run: npm run test:coverage -w akamoney-frontend

      - name: Run redirect tests with coverage
        run: npm run test:coverage -w akamoney-redirect

      - name: Build frontend
        run: npm run build -w akamoney-frontend

      - name: Build backend (dry run)
        run: npm run build -w akamoney-backend

      - name: Build redirect (dry run)
        run: npm run build -w akamoney-redirect

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '24.x'
        with:
          name: backend-coverage-report
          path: src/backend/coverage/
          retention-days: 30

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '24.x'
        with:
          name: frontend-coverage-report
          path: src/frontend/coverage/
          retention-days: 30

      - name: Upload redirect coverage report
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '24.x'
        with:
          name: redirect-coverage-report
          path: src/redirect/coverage/
          retention-days: 30

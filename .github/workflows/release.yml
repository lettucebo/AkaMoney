name: Release

# Production release trust boundary (issue #140).
#
# Supported production triggers, and nothing else:
#   1. Push of an exact SemVer tag such as `1.3.0`. The `*.*.*` filter is only a coarse prefilter;
#      `prepare-release` enforces the exact `MAJOR.MINOR.PATCH` shape.
#   2. `workflow_dispatch` started from `main`, with an explicit ref and a typed confirmation.
#
# The pull-request-target trigger and the release label that went with it are deliberately absent.
# They executed unmerged pull request code in jobs that hold Cloudflare, Azure, Entra and Sentry
# credentials, so a label was the only thing standing between PR-controlled dependency lifecycle
# scripts and production. Merging a pull request now deploys nothing. See docs/DEPLOYMENT.md for
# the full trigger policy.
# No job may execute code from the released ref before `prepare-release` has proven that ref is a
# commit on `main`, and the validator itself is always checked out from `main`. Every later job
# consumes only that immutable validated SHA, never the raw event ref.
#
# Documented limitations, deliberately not claimed as solved:
#   * The `production` required reviewer is the sole maintainer, self-review is permitted and
#     repository admins can bypass the environment, so approval is a confirmation rather than
#     independent authorization.
#   * A SemVer tag created on a historical commit still runs *that commit's* workflow file,
#     including versions from before this hardening. Neither the environment tag policy nor the
#     reviewer can inspect workflow age; the maintainer must reject such a run.
#   * Anyone with write access can push a tag or start a dispatch, and the repository has no branch
#     protection, so trusted same-repo writers remain trusted. Only external/unmerged PR-head
#     execution is removed here.
#   * `CLOUDFLARE_API_TOKEN` and `AZURE_STORAGE_SAS_TOKEN` are still repository secrets and stay
#     readable by any workflow run in this repository; only `SENTRY_AUTH_TOKEN` is environment
#     scoped. Every job below that reads a secret still declares `environment: production`, so the
#     required reviewer applies to it.
#   * The `production` environment currently has no deployment branch/tag policy configured, so the
#     environment itself does not restrict which ref may deploy; the checks in this workflow do.
#     Adding a custom policy (branch `main` plus tag `*.*.*`) is recommended follow-up.
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Commit to deploy: the literal "main", or an exact 40-character commit SHA already on main'
        required: true
        default: 'main'
        type: string
      confirm_production:
        description: 'Type DEPLOY_PRODUCTION exactly to confirm a production deployment'
        required: true
        type: string

permissions:
  contents: read
  deployments: write

# Production releases are serialised and never cancelled mid-flight: interrupting a release can
# leave Cloudflare resources provisioned by one commit and Workers deployed from another.
concurrency:
  group: release-production
  cancel-in-progress: false

env:
  CLOUDFLARE_PAGES_PROJECT: akamoney-admin

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    # No environment and no secret: this job decides what may be deployed, so it must never hold a
    # deployment credential itself.
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      # Trusted policy source. Only `main` is checked out here, never the ref being released, so a
      # tag or dispatch can never supply the validator that judges it.
      - name: Checkout trusted release policy from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .release-policy
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # Every event value reaches the resolver through `env:` and is read by shell-free Node code,
      # so no tag name, ref or dispatch input is ever expanded by a shell. The resolver requires an
      # exact SemVer tag (or `main`/an exact SHA for manual runs), dereferences annotated tags with
      # `^{commit}`, cross-checks the event SHA, and requires the result to be an ancestor of a
      # freshly fetched `origin/main`.
      - name: Resolve and validate the release commit
        id: resolve
        env:
          RELEASE_MODE: resolve
          RELEASE_REPO_DIR: .release-policy
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_DISPATCH_REF: ${{ inputs.release_ref }}
          RELEASE_DISPATCH_CONFIRM: ${{ inputs.confirm_production }}
        run: node .release-policy/.github/scripts/resolve-release-ref.mjs

      - name: Add release validation summary
        env:
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
          RELEASE_TRIGGER: ${{ github.event_name }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "## Release Ref Validation :closed_lock_with_key:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Validated commit** | ${RELEASE_SHA} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trigger** | ${RELEASE_TRIGGER} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Started by** | ${RELEASE_ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Mainline policy** | ancestor of origin/main |" >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      # Only the immutable commit validated by prepare-release is ever built.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_ENTRA_ID_CLIENT_ID: ${{ vars.ENTRA_ID_CLIENT_ID }}
          VITE_ENTRA_ID_TENANT_ID: ${{ vars.ENTRA_ID_TENANT_ID }}
          VITE_ENTRA_ID_REDIRECT_URI: ${{ vars.ENTRA_ID_REDIRECT_URI }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_NAME: AkaMoney
          VITE_SHORT_DOMAIN: ${{ vars.SHORT_DOMAIN }}
          VITE_ARCHIVED_REDIRECT_URL: ${{ vars.ARCHIVED_REDIRECT_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_REPLAY_ENABLED: ${{ vars.VITE_SENTRY_REPLAY_ENABLED }}
        # The Sentry upload credential is deliberately absent here. This job runs outside the
        # protected production environment and executes the released commit's dependency and build
        # scripts, so it must hold no deployment credential. The Vite Sentry plugin therefore stays
        # inactive, hidden source maps stay in the artifact, and deploy-frontend uploads them from
        # the protected production environment.
        run: |
          set -euo pipefail
          if [ -z "${VITE_SENTRY_DSN:-}" ]; then
            echo "Error: VITE_SENTRY_DSN variable is not set; refusing to build the frontend without error monitoring"
            exit 1
          fi
          # Whitespace-only or whitespace-containing values are unusable DSNs: reject them before
          # the build so a mistyped variable cannot be baked into the bundle.
          case "$VITE_SENTRY_DSN" in
            *[[:space:]]*)
              echo "Error: VITE_SENTRY_DSN contains whitespace; refusing to build the frontend with an unusable DSN"
              exit 1
              ;;
          esac
          # The bash guards above are only a coarse first pass: POSIX [[:space:]] is locale-dependent
          # (this workflow pins no locale), it never matches zero-width characters, and it checks nothing
          # structural. Percent-encoded control characters and delimiters are worse: they survive a WHATWG
          # URL parse untouched, while @sentry/core 10.71 either rejects them or silently truncates the
          # project id - so a valid-looking DSN would deploy production without error monitoring. Node 24
          # and the workspace dependencies are already installed for this job, so validate with the same
          # parser that actually transports events (makeDsn) behind a printable-ASCII gate. The candidate
          # is passed through the environment, never on argv, and only the variable name is ever printed.
          SENTRY_DSN_VAR_NAME="VITE_SENTRY_DSN" \
          SENTRY_DSN_CANDIDATE="${VITE_SENTRY_DSN:-}" \
          node -e '
            const name = process.env.SENTRY_DSN_VAR_NAME;
            const raw = process.env.SENTRY_DSN_CANDIDATE ?? "";
            const reject = (reason) => {
              console.error("Error: " + name + " " + reason + "; refusing to continue without usable Sentry error monitoring");
              process.exit(1);
            };
            if (raw === "") reject("is not set or is empty");
            if (!/^[\x21-\x7e]+$/.test(raw)) reject("must contain only printable non-space ASCII (0x21-0x7E); space, control, invisible and non-ASCII characters are rejected");
            if (raw.includes("%")) reject("must not contain a percent sign; percent-encoded delimiters and control characters survive a URL parse but are rejected or silently truncated by the Sentry SDK");
            let url = null;
            try { url = new URL(raw); } catch { reject("is not a parsable URL"); }
            if (url.protocol !== "https:") reject("must use the https scheme");
            if (url.username === "") reject("is missing the Sentry public key before @");
            if (url.hostname === "") reject("is missing a host");
            if (url.search !== "" || url.hash !== "") reject("must not carry a query string or fragment");
            if (!/^\/[0-9]+$/.test(url.pathname)) reject("must end with a single numeric Sentry project id path segment");
            let core = null;
            let coreVersion = "";
            try { core = require("@sentry/core"); coreVersion = require("@sentry/core/package.json").version; } catch { reject("cannot be validated because @sentry/core is not installed; workspace dependencies must be installed before this gate runs"); }
            if (!/^10\./.test(coreVersion)) reject("cannot be validated because the installed @sentry/core is not the 10.x line this gate was verified against");
            if (typeof core.makeDsn !== "function") reject("cannot be validated because the installed @sentry/core exposes no makeDsn parser");
            const outWrite = process.stdout.write.bind(process.stdout);
            const errWrite = process.stderr.write.bind(process.stderr);
            let dsn = null;
            process.stdout.write = () => true;
            process.stderr.write = () => true;
            try { dsn = core.makeDsn(raw); } catch { dsn = null; } finally { process.stdout.write = outWrite; process.stderr.write = errWrite; }
            if (!dsn) reject("is rejected by the installed @sentry/core makeDsn parser, so it could never transport events");
            const urlPort = url.port === "" ? "443" : url.port;
            const dsnPort = dsn.port === "" ? "443" : dsn.port;
            if (dsn.protocol !== "https" || dsn.publicKey !== url.username || dsn.host.toLowerCase() !== url.hostname || dsnPort !== urlPort || dsn.path !== "" || dsn.projectId !== url.pathname.slice(1)) reject("is parsed differently by @sentry/core than by the URL parser, so the deployed value would not be what Sentry receives");
          '
          npm run build -w akamoney-frontend

      - name: Build backend (dry run)
        run: npm run build -w akamoney-backend

      - name: Build redirect (dry run)
        run: npm run build -w akamoney-redirect

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/dist/
          retention-days: 1

  deploy-admin-api:
    runs-on: ubuntu-latest
    needs: [prepare-release, build]
    environment: production

    steps:
      # The validated commit is checked out first: actions/checkout cleans its target directory, so
      # the trusted policy tree is created afterwards and cannot be removed by this checkout.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Checkout trusted release policy from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .release-policy
          fetch-depth: 0

      # Waiting for the production reviewer can take arbitrarily long. Re-prove from the trusted
      # main clone that the selected commit is still on mainline before anything from the released
      # commit executes (npm lifecycle scripts run during `npm ci`) and before any secret is read.
      # This runs on the runner's preinstalled Node, ahead of setup-node, so not even the npm cache
      # is keyed on the selected tree until ancestry has been re-proved.
      - name: Recheck the release commit against mainline
        env:
          RELEASE_MODE: recheck
          RELEASE_REPO_DIR: .release-policy
          RELEASE_SELECTED_SHA: ${{ needs.prepare-release.outputs.sha }}
        run: node .release-policy/.github/scripts/resolve-release-ref.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate Sentry DSN
        env:
          VAR_SENTRY_DSN: ${{ vars.SENTRY_BACKEND_DSN }}
        # Ordering gate: this is the first step after dependency installation, before any build,
        # any Cloudflare API call and any wrangler.toml edit. An unusable DSN therefore cannot
        # leave a half-created D1 database or R2 bucket, or a mutated wrangler.toml, behind. The
        # injection step later re-runs the byte-identical validator immediately before it writes
        # the value (defence in depth), so the gate does not depend on step ordering alone.
        run: |
          set -euo pipefail
          if [ -z "${VAR_SENTRY_DSN:-}" ]; then
            echo "Error: SENTRY_BACKEND_DSN variable is not set; refusing to deploy the Admin API without error monitoring"
            exit 1
          fi
          case "$VAR_SENTRY_DSN" in
            *[[:space:]]*)
              echo "Error: SENTRY_BACKEND_DSN is whitespace-only or contains whitespace; refusing to deploy the Admin API with an unusable DSN"
              exit 1
              ;;
            *'"'*|*'\'*)
              echo "Error: SENTRY_BACKEND_DSN contains characters that cannot be embedded in a TOML basic string"
              exit 1
              ;;
          esac
          # The bash guards above are only a coarse first pass: POSIX [[:space:]] is locale-dependent
          # (this workflow pins no locale), it never matches zero-width characters, and it checks nothing
          # structural. Percent-encoded control characters and delimiters are worse: they survive a WHATWG
          # URL parse untouched, while @sentry/core 10.71 either rejects them or silently truncates the
          # project id - so a valid-looking DSN would deploy production without error monitoring. Node 24
          # and the workspace dependencies are already installed for this job, so validate with the same
          # parser that actually transports events (makeDsn) behind a printable-ASCII gate. The candidate
          # is passed through the environment, never on argv, and only the variable name is ever printed.
          SENTRY_DSN_VAR_NAME="SENTRY_BACKEND_DSN" \
          SENTRY_DSN_CANDIDATE="$VAR_SENTRY_DSN" \
          node -e '
            const name = process.env.SENTRY_DSN_VAR_NAME;
            const raw = process.env.SENTRY_DSN_CANDIDATE ?? "";
            const reject = (reason) => {
              console.error("Error: " + name + " " + reason + "; refusing to continue without usable Sentry error monitoring");
              process.exit(1);
            };
            if (raw === "") reject("is not set or is empty");
            if (!/^[\x21-\x7e]+$/.test(raw)) reject("must contain only printable non-space ASCII (0x21-0x7E); space, control, invisible and non-ASCII characters are rejected");
            if (raw.includes("%")) reject("must not contain a percent sign; percent-encoded delimiters and control characters survive a URL parse but are rejected or silently truncated by the Sentry SDK");
            let url = null;
            try { url = new URL(raw); } catch { reject("is not a parsable URL"); }
            if (url.protocol !== "https:") reject("must use the https scheme");
            if (url.username === "") reject("is missing the Sentry public key before @");
            if (url.hostname === "") reject("is missing a host");
            if (url.search !== "" || url.hash !== "") reject("must not carry a query string or fragment");
            if (!/^\/[0-9]+$/.test(url.pathname)) reject("must end with a single numeric Sentry project id path segment");
            let core = null;
            let coreVersion = "";
            try { core = require("@sentry/core"); coreVersion = require("@sentry/core/package.json").version; } catch { reject("cannot be validated because @sentry/core is not installed; workspace dependencies must be installed before this gate runs"); }
            if (!/^10\./.test(coreVersion)) reject("cannot be validated because the installed @sentry/core is not the 10.x line this gate was verified against");
            if (typeof core.makeDsn !== "function") reject("cannot be validated because the installed @sentry/core exposes no makeDsn parser");
            const outWrite = process.stdout.write.bind(process.stdout);
            const errWrite = process.stderr.write.bind(process.stderr);
            let dsn = null;
            process.stdout.write = () => true;
            process.stderr.write = () => true;
            try { dsn = core.makeDsn(raw); } catch { dsn = null; } finally { process.stdout.write = outWrite; process.stderr.write = errWrite; }
            if (!dsn) reject("is rejected by the installed @sentry/core makeDsn parser, so it could never transport events");
            const urlPort = url.port === "" ? "443" : url.port;
            const dsnPort = dsn.port === "" ? "443" : dsn.port;
            if (dsn.protocol !== "https" || dsn.publicKey !== url.username || dsn.host.toLowerCase() !== url.hostname || dsnPort !== urlPort || dsn.path !== "" || dsn.projectId !== url.pathname.slice(1)) reject("is parsed differently by @sentry/core than by the URL parser, so the deployed value would not be what Sentry receives");
          '
          echo "SENTRY_BACKEND_DSN validated before any external change"

      # Production must report environment=production to Sentry. The tracked config keeps
      # "development" so local runs are never mistaken for production, and the value is
      # hardcoded here rather than read from an optional repository variable, which would
      # silently fall back to "development" if unset. This runs after the DSN gate and
      # before any Cloudflare mutation, so a failure leaves nothing changed externally.
      - name: Set production environment in wrangler.toml
        run: |
          set -euo pipefail
          cd src/backend
          sed -i 's|^[[:space:]]*ENVIRONMENT[[:space:]]*=.*|ENVIRONMENT = "production"|' wrangler.toml
          ENVIRONMENT_TOTAL=$(grep -cE '^[[:space:]]*ENVIRONMENT[[:space:]]*=' wrangler.toml || true)
          ENVIRONMENT_PRODUCTION=$(grep -c '^ENVIRONMENT = "production"$' wrangler.toml || true)
          if [ "$ENVIRONMENT_TOTAL" != "1" ] || [ "$ENVIRONMENT_PRODUCTION" != "1" ]; then
            echo "Error: expected exactly one production ENVIRONMENT assignment in src/backend/wrangler.toml (total=${ENVIRONMENT_TOTAL}, production=${ENVIRONMENT_PRODUCTION})"
            exit 1
          fi
          echo "Admin API ENVIRONMENT set to production"

      - name: Verify pinned Wrangler version
        run: |
          set -euo pipefail
          VERSION=$(cd src/backend && npx --no-install wrangler --version)
          echo "Resolved Wrangler version: $VERSION"
          if [ "$VERSION" != "4.90.0" ]; then
            echo "Error: expected Wrangler 4.90.0 for the Admin API, got '$VERSION'"
            exit 1
          fi

      - name: Ensure D1 database exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd src/backend
          DB_NAME="akamoney-clicks"
          echo "Checking if D1 database '$DB_NAME' exists..."
          if npx --no-install wrangler d1 list 2>/dev/null | grep -qw "$DB_NAME"; then
            echo "Database '$DB_NAME' already exists"
          else
            echo "Creating D1 database '$DB_NAME'..."
            npx --no-install wrangler d1 create "$DB_NAME"
            echo "Database '$DB_NAME' created successfully"
          fi

      - name: Get D1 Database ID
        id: d1-database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd src/backend
          DB_NAME="akamoney-clicks"
          # Get the database ID from wrangler d1 list output using JSON format for reliable parsing
          DB_ID=$(npx --no-install wrangler d1 list --json 2>/dev/null | jq -r --arg name "$DB_NAME" '.[] | select(.name == $name) | .uuid')
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Error: Could not retrieve database ID for '$DB_NAME'"
            exit 1
          fi
          # Validate UUID format (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)
          if ! echo "$DB_ID" | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "Error: Retrieved database ID '$DB_ID' is not a valid UUID format"
            exit 1
          fi
          echo "Database ID: $DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Inject D1 Database ID into wrangler.toml
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ steps.d1-database.outputs.database_id }}
        run: |
          # Validate that the database ID is set
          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "Error: CLOUDFLARE_D1_DATABASE_ID is not set"
            exit 1
          fi
          # Replace the empty database_id with the retrieved value (allowing flexible whitespace)
          sed -i 's/^[[:space:]]*database_id[[:space:]]*=[[:space:]]*""/database_id = "'"${CLOUDFLARE_D1_DATABASE_ID}"'"/' src/backend/wrangler.toml
          # Verify the replacement was successful without exposing the secret value
          if grep -q '^database_id = "[^"]\+"$' src/backend/wrangler.toml; then
            echo "Successfully injected D1 database ID"
          else
            echo "Error: Failed to inject D1 database ID"
            exit 1
          fi

      - name: Ensure R2 bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd src/backend
          BUCKET_NAME="akamoney-storage"
          echo "Checking if R2 bucket '$BUCKET_NAME' exists..."
          if npx --no-install wrangler r2 bucket list 2>/dev/null | grep -qw "$BUCKET_NAME"; then
            echo "Bucket '$BUCKET_NAME' already exists"
          else
            echo "Creating R2 bucket '$BUCKET_NAME'..."
            npx --no-install wrangler r2 bucket create "$BUCKET_NAME"
            echo "Bucket '$BUCKET_NAME' created successfully"
          fi

      - name: Inject Worker variables into wrangler.toml
        env:
          VAR_ENTRA_ID_TENANT_ID: ${{ vars.ENTRA_ID_TENANT_ID }}
          VAR_ENTRA_ID_CLIENT_ID: ${{ vars.ENTRA_ID_CLIENT_ID }}
          VAR_SHORT_DOMAIN: ${{ vars.SHORT_DOMAIN }}
          VAR_D1_ANALYTICS_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VAR_D1_ANALYTICS_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          VAR_STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER }}
          VAR_AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          VAR_AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          VAR_SENTRY_DSN: ${{ vars.SENTRY_BACKEND_DSN }}
        run: |
          set -e
          cd src/backend
          echo "Injecting Worker variables into wrangler.toml..."

          # Sentry DSN is mandatory for the Admin API. Validation lives in a function so the same
          # rules run before any file is modified and again immediately before the replacement.
          validate_sentry_dsn() {
            if [ -z "$VAR_SENTRY_DSN" ]; then
              echo "Error: SENTRY_BACKEND_DSN variable is not set; refusing to deploy the Admin API without error monitoring"
              return 1
            fi
            case "$VAR_SENTRY_DSN" in
              *[[:space:]]*)
                echo "Error: SENTRY_BACKEND_DSN is whitespace-only or contains whitespace; refusing to deploy the Admin API with an unusable DSN"
                return 1
                ;;
              *'"'*|*'\'*)
                echo "Error: SENTRY_BACKEND_DSN contains characters that cannot be embedded in a TOML basic string"
                return 1
                ;;
            esac
            # The bash guards above are only a coarse first pass: POSIX [[:space:]] is locale-dependent
            # (this workflow pins no locale), it never matches zero-width characters, and it checks nothing
            # structural. Percent-encoded control characters and delimiters are worse: they survive a WHATWG
            # URL parse untouched, while @sentry/core 10.71 either rejects them or silently truncates the
            # project id - so a valid-looking DSN would deploy production without error monitoring. Node 24
            # and the workspace dependencies are already installed for this job, so validate with the same
            # parser that actually transports events (makeDsn) behind a printable-ASCII gate. The candidate
            # is passed through the environment, never on argv, and only the variable name is ever printed.
            SENTRY_DSN_VAR_NAME="SENTRY_BACKEND_DSN" \
            SENTRY_DSN_CANDIDATE="$VAR_SENTRY_DSN" \
            node -e '
              const name = process.env.SENTRY_DSN_VAR_NAME;
              const raw = process.env.SENTRY_DSN_CANDIDATE ?? "";
              const reject = (reason) => {
                console.error("Error: " + name + " " + reason + "; refusing to continue without usable Sentry error monitoring");
                process.exit(1);
              };
              if (raw === "") reject("is not set or is empty");
              if (!/^[\x21-\x7e]+$/.test(raw)) reject("must contain only printable non-space ASCII (0x21-0x7E); space, control, invisible and non-ASCII characters are rejected");
              if (raw.includes("%")) reject("must not contain a percent sign; percent-encoded delimiters and control characters survive a URL parse but are rejected or silently truncated by the Sentry SDK");
              let url = null;
              try { url = new URL(raw); } catch { reject("is not a parsable URL"); }
              if (url.protocol !== "https:") reject("must use the https scheme");
              if (url.username === "") reject("is missing the Sentry public key before @");
              if (url.hostname === "") reject("is missing a host");
              if (url.search !== "" || url.hash !== "") reject("must not carry a query string or fragment");
              if (!/^\/[0-9]+$/.test(url.pathname)) reject("must end with a single numeric Sentry project id path segment");
              let core = null;
              let coreVersion = "";
              try { core = require("@sentry/core"); coreVersion = require("@sentry/core/package.json").version; } catch { reject("cannot be validated because @sentry/core is not installed; workspace dependencies must be installed before this gate runs"); }
              if (!/^10\./.test(coreVersion)) reject("cannot be validated because the installed @sentry/core is not the 10.x line this gate was verified against");
              if (typeof core.makeDsn !== "function") reject("cannot be validated because the installed @sentry/core exposes no makeDsn parser");
              const outWrite = process.stdout.write.bind(process.stdout);
              const errWrite = process.stderr.write.bind(process.stderr);
              let dsn = null;
              process.stdout.write = () => true;
              process.stderr.write = () => true;
              try { dsn = core.makeDsn(raw); } catch { dsn = null; } finally { process.stdout.write = outWrite; process.stderr.write = errWrite; }
              if (!dsn) reject("is rejected by the installed @sentry/core makeDsn parser, so it could never transport events");
              const urlPort = url.port === "" ? "443" : url.port;
              const dsnPort = dsn.port === "" ? "443" : dsn.port;
              if (dsn.protocol !== "https" || dsn.publicKey !== url.username || dsn.host.toLowerCase() !== url.hostname || dsnPort !== urlPort || dsn.path !== "" || dsn.projectId !== url.pathname.slice(1)) reject("is parsed differently by @sentry/core than by the URL parser, so the deployed value would not be what Sentry receives");
            '
          }

          # Fail before any file is modified or deployed.
          validate_sentry_dsn

          # Create a temporary file for variables
          TEMP_VARS_FILE=$(mktemp)
          HAS_VARS=false

          if [ -n "$VAR_ENTRA_ID_TENANT_ID" ]; then
            echo "ENTRA_ID_TENANT_ID = \"${VAR_ENTRA_ID_TENANT_ID}\"" >> "$TEMP_VARS_FILE"
            HAS_VARS=true
          else
            echo "Warning: ENTRA_ID_TENANT_ID is not set, skipping..."
          fi

          if [ -n "$VAR_ENTRA_ID_CLIENT_ID" ]; then
            echo "ENTRA_ID_CLIENT_ID = \"${VAR_ENTRA_ID_CLIENT_ID}\"" >> "$TEMP_VARS_FILE"
            HAS_VARS=true
          else
            echo "Warning: ENTRA_ID_CLIENT_ID is not set, skipping..."
          fi

          if [ -n "$VAR_SHORT_DOMAIN" ]; then
            echo "SHORT_DOMAIN = \"${VAR_SHORT_DOMAIN}\"" >> "$TEMP_VARS_FILE"
            HAS_VARS=true
          else
            echo "Warning: SHORT_DOMAIN is not set, skipping..."
          fi

          # D1 Analytics configuration (optional)
          if [ -n "$VAR_D1_ANALYTICS_ACCOUNT_ID" ]; then
            echo "D1_ANALYTICS_ACCOUNT_ID = \"${VAR_D1_ANALYTICS_ACCOUNT_ID}\"" >> "$TEMP_VARS_FILE"
            HAS_VARS=true
          else
            echo "Warning: D1_ANALYTICS_ACCOUNT_ID for D1 analytics is not set, D1 stats will use estimation mode..."
          fi

          if [ -n "$VAR_D1_ANALYTICS_DATABASE_ID" ]; then
            echo "D1_ANALYTICS_DATABASE_ID = \"${VAR_D1_ANALYTICS_DATABASE_ID}\"" >> "$TEMP_VARS_FILE"
            HAS_VARS=true
          else
            echo "Warning: D1_ANALYTICS_DATABASE_ID for D1 analytics is not set, D1 stats will use estimation mode..."
          fi

          # Storage configuration (optional - defaults to R2 if not set)
          # Note: STORAGE_PROVIDER is already defined in wrangler.toml, so we replace it instead of appending
          if [ -n "$VAR_STORAGE_PROVIDER" ]; then
            # Replace the existing STORAGE_PROVIDER value in wrangler.toml
            # Using | as delimiter to avoid conflicts with / in values, and escape special chars
            ESCAPED_PROVIDER=$(printf '%s\n' "$VAR_STORAGE_PROVIDER" | sed 's/[&/\]/\\&/g')
            sed -i "s|^[[:space:]]*STORAGE_PROVIDER[[:space:]]*=.*|STORAGE_PROVIDER = \"${ESCAPED_PROVIDER}\"|" wrangler.toml
            echo "Storage provider configured: $VAR_STORAGE_PROVIDER"
          else
            echo "Info: STORAGE_PROVIDER is not set, using default from wrangler.toml (r2)..."
          fi

          if [ -n "$VAR_AZURE_STORAGE_ACCOUNT" ]; then
            echo "AZURE_STORAGE_ACCOUNT = \"${VAR_AZURE_STORAGE_ACCOUNT}\"" >> "$TEMP_VARS_FILE"
            HAS_VARS=true
          else
            echo "Info: AZURE_STORAGE_ACCOUNT is not set (only needed for Azure storage)..."
          fi

          if [ -n "$VAR_AZURE_STORAGE_CONTAINER" ]; then
            echo "AZURE_STORAGE_CONTAINER = \"${VAR_AZURE_STORAGE_CONTAINER}\"" >> "$TEMP_VARS_FILE"
            HAS_VARS=true
          else
            echo "Info: AZURE_STORAGE_CONTAINER is not set (only needed for Azure storage)..."
          fi

          # Append variables to the [vars] section (after STORAGE_PROVIDER line or after [vars] header)
          if [ "$HAS_VARS" = true ]; then
            # Check if STORAGE_PROVIDER line exists, then append after it (only first occurrence)
            # Otherwise, fall back to appending after [vars] section header (only first occurrence)
            if grep -q '^STORAGE_PROVIDER = ' wrangler.toml; then
              # STORAGE_PROVIDER exists, append after first occurrence
              awk -v file="$TEMP_VARS_FILE" '
                  BEGIN { done = 0 }
                  /^STORAGE_PROVIDER = / && !done {
                      print
                      while ((getline line < file) > 0) print line
                      close(file)
                      done = 1
                      next
                  }
                  { print }
              ' wrangler.toml > wrangler.toml.new && mv wrangler.toml.new wrangler.toml
            else
              # STORAGE_PROVIDER not found, append after first [vars] section header
              awk -v file="$TEMP_VARS_FILE" '
                  BEGIN { done = 0 }
                  /^\[vars\]$/ && !done {
                      print
                      while ((getline line < file) > 0) print line
                      close(file)
                      done = 1
                      next
                  }
                  { print }
              ' wrangler.toml > wrangler.toml.new && mv wrangler.toml.new wrangler.toml
            fi
            echo "Worker variables injected successfully"
          else
            echo "No variables to inject"
          fi

          # Sentry DSN: replace the existing empty placeholder inside [vars] rather than appending a
          # second key. Escape sed replacement metacharacters (& and \) plus the | delimiter.
          # Re-validate immediately before the replacement so the value written into wrangler.toml
          # is proven safe at the moment it is written.
          validate_sentry_dsn
          ESCAPED_SENTRY_DSN=$(printf '%s\n' "$VAR_SENTRY_DSN" | sed 's/[&|\\]/\\&/g')
          sed -i "s|^[[:space:]]*SENTRY_DSN[[:space:]]*=.*|SENTRY_DSN = \"${ESCAPED_SENTRY_DSN}\"|" wrangler.toml
          # Verify exactly one non-empty assignment without printing the DSN itself.
          SENTRY_DSN_COUNT=$(grep -c '^SENTRY_DSN = "[^"]\+"$' wrangler.toml || true)
          if [ "$SENTRY_DSN_COUNT" != "1" ]; then
            echo "Error: expected exactly one non-empty SENTRY_DSN assignment in wrangler.toml, found ${SENTRY_DSN_COUNT}"
            exit 1
          fi
          echo "Sentry DSN injected into src/backend/wrangler.toml"

          rm -f "$TEMP_VARS_FILE"

      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_ENTRA_ID_CLIENT_SECRET: ${{ secrets.ENTRA_ID_CLIENT_SECRET }}
          SECRET_D1_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
        run: |
          set -e
          cd src/backend
          echo "Configuring Worker secrets..."

          if [ -n "$SECRET_ENTRA_ID_CLIENT_SECRET" ]; then
            npx --no-install wrangler secret put ENTRA_ID_CLIENT_SECRET <<< "$SECRET_ENTRA_ID_CLIENT_SECRET"
          else
            echo "Warning: ENTRA_ID_CLIENT_SECRET is not set, skipping..."
          fi

          # Configure Cloudflare D1 Analytics API token (optional - this is a secret)
          if [ -n "$SECRET_D1_ANALYTICS_API_TOKEN" ]; then
            npx --no-install wrangler secret put D1_ANALYTICS_API_TOKEN <<< "$SECRET_D1_ANALYTICS_API_TOKEN"
          else
            echo "Warning: D1_ANALYTICS_API_TOKEN for D1 analytics is not set, D1 stats will use estimation mode..."
          fi

          # Configure Azure Storage SAS token (optional - only needed if using Azure instead of R2)
          if [ -n "$SECRET_AZURE_STORAGE_SAS_TOKEN" ]; then
            npx --no-install wrangler secret put AZURE_STORAGE_SAS_TOKEN <<< "$SECRET_AZURE_STORAGE_SAS_TOKEN"
          else
            echo "Info: AZURE_STORAGE_SAS_TOKEN is not set (only needed for Azure storage)..."
          fi

          echo "Worker secrets configured successfully"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src/backend
          command: deploy
          wranglerVersion: '4.90.0'

      - name: Add deployment summary
        if: always()
        # The summary reports the commit prepare-release validated, never the raw event ref, so it
        # can never claim a commit that was not proven to be on mainline.
        env:
          JOB_STATUS: ${{ job.status }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
          RELEASE_TRIGGER: ${{ github.event_name }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "## Admin API Deployment Summary :rocket:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Status** | ✅ Deployed successfully |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Service** | akamoney-admin-api |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Environment** | Production |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Commit** | ${RELEASE_SHA} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Trigger** | ${RELEASE_TRIGGER} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Triggered by** | ${RELEASE_ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Admin API Deployment Summary :x:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Status** | ❌ Deployment failed |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Service** | akamoney-admin-api |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Environment** | Production |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Commit** | ${RELEASE_SHA} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Trigger** | ${RELEASE_TRIGGER} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Triggered by** | ${RELEASE_ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Please check the workflow logs for more details." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-redirect:
    runs-on: ubuntu-latest
    needs: [prepare-release, build]
    environment: production

    steps:
      # The validated commit is checked out first: actions/checkout cleans its target directory, so
      # the trusted policy tree is created afterwards and cannot be removed by this checkout.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Checkout trusted release policy from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .release-policy
          fetch-depth: 0

      # Same approval-drift guard as the Admin API deployment: ancestry is re-proved from the
      # trusted main clone, on the runner's preinstalled Node, before released code executes or any
      # secret is read.
      - name: Recheck the release commit against mainline
        env:
          RELEASE_MODE: recheck
          RELEASE_REPO_DIR: .release-policy
          RELEASE_SELECTED_SHA: ${{ needs.prepare-release.outputs.sha }}
        run: node .release-policy/.github/scripts/resolve-release-ref.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate Sentry DSN
        env:
          SENTRY_DSN: ${{ vars.SENTRY_REDIRECT_DSN }}
        # Ordering gate: this is the first step after dependency installation, before any build,
        # any Cloudflare API call and any wrangler.toml edit. An unusable DSN therefore cannot
        # leave a mutated wrangler.toml behind. The injection step later re-runs the byte-identical
        # validator immediately before it writes the value (defence in depth), so the gate does not
        # depend on step ordering alone.
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_DSN:-}" ]; then
            echo "Error: SENTRY_REDIRECT_DSN variable is not set; refusing to deploy the redirect Worker without error monitoring"
            exit 1
          fi
          case "$SENTRY_DSN" in
            *[[:space:]]*)
              echo "Error: SENTRY_REDIRECT_DSN is whitespace-only or contains whitespace; refusing to deploy the redirect Worker with an unusable DSN"
              exit 1
              ;;
            *'"'*|*'\'*)
              echo "Error: SENTRY_REDIRECT_DSN contains characters that cannot be embedded in a TOML basic string"
              exit 1
              ;;
          esac
          # The bash guards above are only a coarse first pass: POSIX [[:space:]] is locale-dependent
          # (this workflow pins no locale), it never matches zero-width characters, and it checks nothing
          # structural. Percent-encoded control characters and delimiters are worse: they survive a WHATWG
          # URL parse untouched, while @sentry/core 10.71 either rejects them or silently truncates the
          # project id - so a valid-looking DSN would deploy production without error monitoring. Node 24
          # and the workspace dependencies are already installed for this job, so validate with the same
          # parser that actually transports events (makeDsn) behind a printable-ASCII gate. The candidate
          # is passed through the environment, never on argv, and only the variable name is ever printed.
          SENTRY_DSN_VAR_NAME="SENTRY_REDIRECT_DSN" \
          SENTRY_DSN_CANDIDATE="$SENTRY_DSN" \
          node -e '
            const name = process.env.SENTRY_DSN_VAR_NAME;
            const raw = process.env.SENTRY_DSN_CANDIDATE ?? "";
            const reject = (reason) => {
              console.error("Error: " + name + " " + reason + "; refusing to continue without usable Sentry error monitoring");
              process.exit(1);
            };
            if (raw === "") reject("is not set or is empty");
            if (!/^[\x21-\x7e]+$/.test(raw)) reject("must contain only printable non-space ASCII (0x21-0x7E); space, control, invisible and non-ASCII characters are rejected");
            if (raw.includes("%")) reject("must not contain a percent sign; percent-encoded delimiters and control characters survive a URL parse but are rejected or silently truncated by the Sentry SDK");
            let url = null;
            try { url = new URL(raw); } catch { reject("is not a parsable URL"); }
            if (url.protocol !== "https:") reject("must use the https scheme");
            if (url.username === "") reject("is missing the Sentry public key before @");
            if (url.hostname === "") reject("is missing a host");
            if (url.search !== "" || url.hash !== "") reject("must not carry a query string or fragment");
            if (!/^\/[0-9]+$/.test(url.pathname)) reject("must end with a single numeric Sentry project id path segment");
            let core = null;
            let coreVersion = "";
            try { core = require("@sentry/core"); coreVersion = require("@sentry/core/package.json").version; } catch { reject("cannot be validated because @sentry/core is not installed; workspace dependencies must be installed before this gate runs"); }
            if (!/^10\./.test(coreVersion)) reject("cannot be validated because the installed @sentry/core is not the 10.x line this gate was verified against");
            if (typeof core.makeDsn !== "function") reject("cannot be validated because the installed @sentry/core exposes no makeDsn parser");
            const outWrite = process.stdout.write.bind(process.stdout);
            const errWrite = process.stderr.write.bind(process.stderr);
            let dsn = null;
            process.stdout.write = () => true;
            process.stderr.write = () => true;
            try { dsn = core.makeDsn(raw); } catch { dsn = null; } finally { process.stdout.write = outWrite; process.stderr.write = errWrite; }
            if (!dsn) reject("is rejected by the installed @sentry/core makeDsn parser, so it could never transport events");
            const urlPort = url.port === "" ? "443" : url.port;
            const dsnPort = dsn.port === "" ? "443" : dsn.port;
            if (dsn.protocol !== "https" || dsn.publicKey !== url.username || dsn.host.toLowerCase() !== url.hostname || dsnPort !== urlPort || dsn.path !== "" || dsn.projectId !== url.pathname.slice(1)) reject("is parsed differently by @sentry/core than by the URL parser, so the deployed value would not be what Sentry receives");
          '
          echo "SENTRY_REDIRECT_DSN validated before any external change"

      # Same production hardcoding as the Admin API job: the redirect Worker must not report
      # environment=development from production, and must not depend on an optional variable.
      - name: Set production environment in wrangler.toml
        run: |
          set -euo pipefail
          cd src/redirect
          sed -i 's|^[[:space:]]*ENVIRONMENT[[:space:]]*=.*|ENVIRONMENT = "production"|' wrangler.toml
          ENVIRONMENT_TOTAL=$(grep -cE '^[[:space:]]*ENVIRONMENT[[:space:]]*=' wrangler.toml || true)
          ENVIRONMENT_PRODUCTION=$(grep -c '^ENVIRONMENT = "production"$' wrangler.toml || true)
          if [ "$ENVIRONMENT_TOTAL" != "1" ] || [ "$ENVIRONMENT_PRODUCTION" != "1" ]; then
            echo "Error: expected exactly one production ENVIRONMENT assignment in src/redirect/wrangler.toml (total=${ENVIRONMENT_TOTAL}, production=${ENVIRONMENT_PRODUCTION})"
            exit 1
          fi
          echo "Redirect Worker ENVIRONMENT set to production"

      - name: Verify pinned Wrangler version
        run: |
          set -euo pipefail
          VERSION=$(cd src/redirect && npx --no-install wrangler --version)
          echo "Resolved Wrangler version: $VERSION"
          if [ "$VERSION" != "3.114.17" ]; then
            echo "Error: expected Wrangler 3.114.17 for the redirect Worker, got '$VERSION'"
            exit 1
          fi

      - name: Get D1 Database ID
        id: d1-database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd src/redirect
          DB_NAME="akamoney-clicks"
          # Get the database ID from wrangler d1 list output using JSON format for reliable parsing
          DB_ID=$(npx --no-install wrangler d1 list --json 2>/dev/null | jq -r --arg name "$DB_NAME" '.[] | select(.name == $name) | .uuid')
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Error: Could not retrieve database ID for '$DB_NAME'"
            exit 1
          fi
          # Validate UUID format (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)
          if ! echo "$DB_ID" | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "Error: Retrieved database ID '$DB_ID' is not a valid UUID format"
            exit 1
          fi
          echo "Database ID: $DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"


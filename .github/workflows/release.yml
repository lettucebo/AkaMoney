          # Validate that the database ID is set
          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "Error: CLOUDFLARE_D1_DATABASE_ID is not set"
            exit 1
          fi
          # Replace the empty database_id with the retrieved value (allowing flexible whitespace)
          sed -i 's/^[[:space:]]*database_id[[:space:]]*=[[:space:]]*""/database_id = "'"${CLOUDFLARE_D1_DATABASE_ID}"'"/' src/redirect/wrangler.toml
          # Verify the replacement was successful without exposing the secret value
          if grep -q '^database_id = "[^"]\+"$' src/redirect/wrangler.toml; then
            echo "Successfully injected D1 database ID"
          else
            echo "Error: Failed to inject D1 database ID"
            exit 1
          fi

      - name: Inject Sentry DSN into wrangler.toml
        env:
          SENTRY_DSN: ${{ vars.SENTRY_REDIRECT_DSN }}
        run: |
          set -euo pipefail
          cd src/redirect
          # Fail before deploy when the DSN is missing, whitespace, or cannot be embedded safely in
          # TOML. This guard is immediately before the only replacement in this step.
          if [ -z "${SENTRY_DSN:-}" ]; then
            echo "Error: SENTRY_REDIRECT_DSN variable is not set; refusing to deploy the redirect Worker without error monitoring"
            exit 1
          fi
          case "$SENTRY_DSN" in
            *[[:space:]]*)
              echo "Error: SENTRY_REDIRECT_DSN is whitespace-only or contains whitespace; refusing to deploy the redirect Worker with an unusable DSN"
              exit 1
              ;;
            *'"'*|*'\'*)
              echo "Error: SENTRY_REDIRECT_DSN contains characters that cannot be embedded in a TOML basic string"
              exit 1
              ;;
          esac
          # The bash guards above are only a coarse first pass: POSIX [[:space:]] is locale-dependent
          # (this workflow pins no locale), it never matches zero-width characters, and it checks nothing
          # structural. Percent-encoded control characters and delimiters are worse: they survive a WHATWG
          # URL parse untouched, while @sentry/core 10.71 either rejects them or silently truncates the
          # project id - so a valid-looking DSN would deploy production without error monitoring. Node 24
          # and the workspace dependencies are already installed for this job, so validate with the same
          # parser that actually transports events (makeDsn) behind a printable-ASCII gate. The candidate
          # is passed through the environment, never on argv, and only the variable name is ever printed.
          SENTRY_DSN_VAR_NAME="SENTRY_REDIRECT_DSN" \
          SENTRY_DSN_CANDIDATE="$SENTRY_DSN" \
          node -e '
            const name = process.env.SENTRY_DSN_VAR_NAME;
            const raw = process.env.SENTRY_DSN_CANDIDATE ?? "";
            const reject = (reason) => {
              console.error("Error: " + name + " " + reason + "; refusing to continue without usable Sentry error monitoring");
              process.exit(1);
            };
            if (raw === "") reject("is not set or is empty");
            if (!/^[\x21-\x7e]+$/.test(raw)) reject("must contain only printable non-space ASCII (0x21-0x7E); space, control, invisible and non-ASCII characters are rejected");
            if (raw.includes("%")) reject("must not contain a percent sign; percent-encoded delimiters and control characters survive a URL parse but are rejected or silently truncated by the Sentry SDK");
            let url = null;
            try { url = new URL(raw); } catch { reject("is not a parsable URL"); }
            if (url.protocol !== "https:") reject("must use the https scheme");
            if (url.username === "") reject("is missing the Sentry public key before @");
            if (url.hostname === "") reject("is missing a host");
            if (url.search !== "" || url.hash !== "") reject("must not carry a query string or fragment");
            if (!/^\/[0-9]+$/.test(url.pathname)) reject("must end with a single numeric Sentry project id path segment");
            let core = null;
            let coreVersion = "";
            try { core = require("@sentry/core"); coreVersion = require("@sentry/core/package.json").version; } catch { reject("cannot be validated because @sentry/core is not installed; workspace dependencies must be installed before this gate runs"); }
            if (!/^10\./.test(coreVersion)) reject("cannot be validated because the installed @sentry/core is not the 10.x line this gate was verified against");
            if (typeof core.makeDsn !== "function") reject("cannot be validated because the installed @sentry/core exposes no makeDsn parser");
            const outWrite = process.stdout.write.bind(process.stdout);
            const errWrite = process.stderr.write.bind(process.stderr);
            let dsn = null;
            process.stdout.write = () => true;
            process.stderr.write = () => true;
            try { dsn = core.makeDsn(raw); } catch { dsn = null; } finally { process.stdout.write = outWrite; process.stderr.write = errWrite; }
            if (!dsn) reject("is rejected by the installed @sentry/core makeDsn parser, so it could never transport events");
            const urlPort = url.port === "" ? "443" : url.port;
            const dsnPort = dsn.port === "" ? "443" : dsn.port;
            if (dsn.protocol !== "https" || dsn.publicKey !== url.username || dsn.host.toLowerCase() !== url.hostname || dsnPort !== urlPort || dsn.path !== "" || dsn.projectId !== url.pathname.slice(1)) reject("is parsed differently by @sentry/core than by the URL parser, so the deployed value would not be what Sentry receives");
          '
          # Replace the existing empty placeholder inside [vars] rather than appending a second key.
          # Escape sed replacement metacharacters (& and \) plus the | delimiter.
          ESCAPED_SENTRY_DSN=$(printf '%s\n' "$SENTRY_DSN" | sed 's/[&|\\]/\\&/g')
          sed -i "s|^[[:space:]]*SENTRY_DSN[[:space:]]*=.*|SENTRY_DSN = \"${ESCAPED_SENTRY_DSN}\"|" wrangler.toml
          # Verify exactly one non-empty assignment without printing the DSN itself.
          SENTRY_DSN_COUNT=$(grep -c '^SENTRY_DSN = "[^"]\+"$' wrangler.toml || true)
          if [ "$SENTRY_DSN_COUNT" != "1" ]; then
            echo "Error: expected exactly one non-empty SENTRY_DSN assignment in wrangler.toml, found ${SENTRY_DSN_COUNT}"
            exit 1
          fi
          echo "Sentry DSN injected into src/redirect/wrangler.toml"

      - name: Deploy Redirect Service to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src/redirect
          command: deploy
          wranglerVersion: '3.114.17'

      - name: Add deployment summary
        if: always()
        # The summary reports the commit prepare-release validated, never the raw event ref.
        env:
          JOB_STATUS: ${{ job.status }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
          RELEASE_TRIGGER: ${{ github.event_name }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "## Redirect Service Deployment Summary :rocket:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Status** | ✅ Deployed successfully |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Service** | akamoney-redirect |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Environment** | Production |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Commit** | ${RELEASE_SHA} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Trigger** | ${RELEASE_TRIGGER} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Triggered by** | ${RELEASE_ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Redirect Service Deployment Summary :x:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Status** | ❌ Deployment failed |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Service** | akamoney-redirect |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Environment** | Production |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Commit** | ${RELEASE_SHA} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Trigger** | ${RELEASE_TRIGGER} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Triggered by** | ${RELEASE_ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Please check the workflow logs for more details." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [prepare-release, build]
    environment: production

    steps:
      # This job never checks out application code; it deploys the artifact built from the
      # validated commit. The trusted policy tree is still required so the ancestry recheck runs
      # from `main` before the Sentry and Cloudflare credentials are used.
      - name: Checkout trusted release policy from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .release-policy
          fetch-depth: 0

      # The recheck runs first, on the runner's preinstalled Node, so the artifact built from the
      # selected commit is not downloaded and no credential is exposed until mainline ancestry has
      # been re-proved from the trusted main clone.
      - name: Recheck the release commit against mainline
        env:
          RELEASE_MODE: recheck
          RELEASE_REPO_DIR: .release-policy
          RELEASE_SELECTED_SHA: ${{ needs.prepare-release.outputs.sha }}
        run: node .release-policy/.github/scripts/resolve-release-ref.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/dist/

      - name: Upload frontend source maps to Sentry
        # Secret boundary: this step is the sole holder of the Sentry upload credential in the
        # whole workflow. It runs in the protected `production` environment after the mainline
        # ancestry recheck, this job checks out no application code, and the credential is handed
        # only to the pinned Sentry CLI operating on the already built artifact.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: money-5c
          SENTRY_PROJECT: akamoney-web
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "Error: SENTRY_AUTH_TOKEN secret is not set; refusing to deploy without uploading source maps"
            exit 1
          fi
          MAP_COUNT=$(find src/frontend/dist -type f -name '*.map' | wc -l)
          if [ "$MAP_COUNT" -eq 0 ]; then
            echo "Error: no .map files found in the frontend artifact; refusing to deploy without source maps"
            exit 1
          fi
          echo "Found ${MAP_COUNT} source map files in the frontend artifact"
          npx --yes @sentry/cli@3.7.0 sourcemaps inject src/frontend/dist
          npx --yes @sentry/cli@3.7.0 sourcemaps upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --validate \
            --wait \
            --strict \
            src/frontend/dist
          # Only after a successful upload: strip the maps so Pages never serves them.
          find src/frontend/dist -type f -name '*.map' -delete
          REMAINING_MAPS=$(find src/frontend/dist -type f -name '*.map' | wc -l)
          if [ "$REMAINING_MAPS" -ne 0 ]; then
            echo "Error: ${REMAINING_MAPS} source map files remain in the artifact after cleanup"
            exit 1
          fi
          echo "Source maps uploaded to Sentry and removed from the deploy artifact"

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT_NAME="${{ env.CLOUDFLARE_PAGES_PROJECT }}"
          echo "Checking if Pages project '$PROJECT_NAME' exists..."
          if npx wrangler pages project list 2>/dev/null | grep -qw "$PROJECT_NAME"; then
            echo "Pages project '$PROJECT_NAME' already exists"
          else
            echo "Creating Pages project '$PROJECT_NAME'..."
            npx wrangler pages project create "$PROJECT_NAME" --production-branch=main
            echo "Pages project '$PROJECT_NAME' created successfully"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src/frontend
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}

      - name: Add deployment summary
        if: always()
        # The summary reports the commit prepare-release validated, never the raw event ref.
        env:
          JOB_STATUS: ${{ job.status }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
          RELEASE_TRIGGER: ${{ github.event_name }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "## Frontend Deployment Summary :rocket:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Status** | ✅ Deployed successfully |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Environment** | Production |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Commit** | ${RELEASE_SHA} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Trigger** | ${RELEASE_TRIGGER} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Triggered by** | ${RELEASE_ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Frontend Deployment Summary :x:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Status** | ❌ Deployment failed |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Environment** | Production |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Commit** | ${RELEASE_SHA} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Trigger** | ${RELEASE_TRIGGER} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Triggered by** | ${RELEASE_ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Please check the workflow logs for more details." >> "$GITHUB_STEP_SUMMARY"
          fi
